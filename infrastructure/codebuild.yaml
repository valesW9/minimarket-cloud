AWSTemplateFormatVersion: '2010-09-09'
Description: Proyecto CodeBuild opcional, con fuente S3 previamente empaquetada
Parameters:
  SourceBucket: {Type: String}
  SourceKey: {Type: String, Default: minimarket-cloud.zip}
  ServiceRoleArn:
    Type: String
    Description: ARN de rol preexistente con permisos para CodeBuild logs y S3 (no concede permisos nuevos)
Resources:
  BuildProject:
    Type: AWS::CodeBuild::Project
    Properties:
      Name: !Sub '${AWS::StackName}-tests'
      ServiceRole: !Ref ServiceRoleArn
      Artifacts: {Type: NO_ARTIFACTS}
      Source:
        Type: S3
        Location: !Sub '${SourceBucket}/${SourceKey}'
        BuildSpec: buildspec.yml
      Environment:
        Type: LINUX_CONTAINER
        ComputeType: BUILD_GENERAL1_SMALL
        Image: aws/codebuild/amazonlinux-x86_64-standard:5.0
Outputs:
  BuildProjectName: {Value: !Ref BuildProject}
