<!DOCTYPE html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Minimarket Cloud | Administración</title><link rel="stylesheet" href="/styles.css"></head><body><header><strong>🛒 Minimarket Cloud</strong><nav><a href="/">Catálogo</a><a href="/admin">Administración</a></nav></header><main><h1>Panel operativo</h1><p>Usa un token de demostración o uno configurado en el servidor. El token permanece solo en memoria de esta pestaña.</p><label>Token administrador <input type="password" id="token" autocomplete="off"></label><button id="load">Consultar pedidos</button><div id="notice" role="status"></div><h2>Pedidos</h2><div id="orders"></div><h2>Inventario</h2><div id="inventory"></div><h2>Nuevo producto</h2><form id="add-product"><input name="name" placeholder="Nombre" required maxlength="120"><input name="price" type="number" min="0" placeholder="Precio" required><input name="stock" type="number" min="0" placeholder="Stock" required><button>Agregar</button></form><h2>Movimientos recientes</h2><div id="movements"></div></main><footer>Acceso operativo protegido por token</footer><script src="/app.js"></script></body></html>
